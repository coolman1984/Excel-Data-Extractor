[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xlextract"
version = "0.1.0"
description = "Offline, evidence-first Excel extraction for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "xlextract contributors" }]
dependencies = [
    "pydantic>=2.7",
    "python-calamine>=0.8",
    "pyarrow>=16",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
com = ["pywin32>=306"]
crypto = ["msoffcrypto-tool>=5.4"]
tui = ["textual>=0.58"]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "openpyxl>=3.1",
    "pyinstaller>=6.8",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
xlextract = "xlextract:main"
xlx = "xlextract:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_excel: requires Microsoft Excel on Windows",
    "safety: protects source-workbook integrity",
    "security: protects offline and secret-handling boundaries",
    "perf: measures performance and memory budgets",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["xlextract"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
